# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "server"

[[functions]]
name = "mint_starter_dog"
source = "src/dog_manager.pony"
energy-budget-mj = 40.0
carbon-budget-mg = 8.0

[[functions]]
name = "broadcast_to_authenticated"
source = "src/connection_manager.pony"
energy-budget-mj = 20.0
carbon-budget-mg = 4.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
